name: GnarlyMapper
options:
  bundleIdPrefix: com.gnarly
  deploymentTarget:
    # RoomCaptureView(frame:arSession:) requires iOS 17.
    # Cognito hosted sign-in uses ASWebAuthenticationSession HTTPS callbacks (iOS 17.4).
    iOS: "17.0"
targets:
  GnarlyMapper:
    type: application
    platform: iOS
    sources:
      - path: GnarlyMapper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grantlin.gnarly.mapper
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: GnarlyMapper/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: GnarlyMapper/GnarlyMapper.entitlements
    entitlements:
      path: GnarlyMapper/GnarlyMapper.entitlements
      properties: {}
  GnarlyMapperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GnarlyMapperTests
    dependencies:
      - target: GnarlyMapper
schemes:
  GnarlyMapper:
    build:
      targets:
        GnarlyMapper: all
        GnarlyMapperTests: [test]
    test:
      targets:
        - GnarlyMapperTests
